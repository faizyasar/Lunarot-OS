document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r; justify-content: center; perspective: 2200px; }\n  .stage-scale { transform: scale(1.1); transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1); }\n  .stage {\n    position: relative; width: 0; height: 0;\n    transform-style: preserve-3d;\n    transform: rotateX(8deg) rotateY(-26deg);\n    transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1);\n    opacity: 0;\n  }\n  .stage.ready { opacity: 1; transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1), opacity 0.24s linear; }\n  /* opening the case swings the whole object so the interior faces you */\n  .viewport.open .stage { transform: rotateX(6deg) rotateY(-8deg) translateX(-52px); }\n\n  /* ============ texture slots ============ */\n  .slot { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }\n  .slot img { width: 100%; height: 100%; object-fit: fill; display: block; }\n  .slot .hint {\n    position: absolute; inset: 0; display: flex; flex-direction: column;\n    align-items: center; justify-content: center; gap: 4px; text-align: center;\n    font-size: 5px; letter-spacing: 0.24em; text-transform: uppercase;\n    color: rgba(239,237,232,0.34); padding: 6px;\n    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 4px, transparent 4px 9px), #070707;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);\n  }\n  .slot .hint b { font-size: 5.5px; color: rgba(239,237,232,0.62); letter-spacing: 0.2em; }\n  .slot.filled .hint, .slot.filled .mag-print { display: none; }\n\n  /* ================================================================\n     RETAIL CLAMSHELL CASE — two hinged half-shells, 200 x 300 x 12 each\n     ================================================================ */\n  .case {\n    position: absolute; width: 200px; height: 300px;\n    left: -100px; top: -150px;\n    transform-style: preserve-3d;\n  }\n\n  /* ---- BASE half : holds the moulded cartridge tray ---- */\n  .base { position: absolute; inset: 0; transform-style: preserve-3d; }\n  .base-outer {                                   /* rear cover, faces away */\n    position: absolute; inset: 0; transform: rotateY(180deg);\n    background: #060606; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);\n  }\n  .base-inner {                                   /* interior floor, faces you */\n    position: absolute; inset: 0; transform: translateZ(12px);\n    background: linear-gradient(158deg, #121214, #08080a 62%, #0e0e10);\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 22px rgba(0,0,0,0.85);\n  }\n  .bwall { position: absolute; background: #101013; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.13); }\n  .bwall.t { width: 200px; height: 12px; top: 0; left: 0; transform-origin: top center; transform: rotateX(90deg); }\n  .bwall.b { width: 200px; height: 12px; bottom: 0; left: 0; transform-origin: bottom center; transform: rotateX(-90deg); }\n  .bwall.r { width: 12px; height: 300px; top: 0; right: 0; transform-origin: center right; transform: rotateY(90deg); }\n\n  /* moulded tray + retention ribs the cartridge clips into */\n  .tray {\n    position: absolute; left: 30px; top: 62px; width: 140px; height: 175px;\n    transform: translateZ(13px); transform-style: preserve-3d;\n    background: linear-gradient(160deg, #17171a, #0b0b0d 55%, #131316);\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09), 0 3px 10px rgba(0,0,0,0.85);\n  }\n  .rib { position: absolute; height: 6px; left: 10px; right: 10px; background: #1e1e22; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }\n  .rib.t { top: 6px; }\n  .rib.b { bottom: 6px; }\n  .tray-tag {\n    position: absolute; left: 0; right: 0; bottom: -20px; text-align: center;\n    font-size: 5px; letter-spacing: 0.3em; color: rgba(239,237,232,0.3);\n  }\n  .base-crest {\n    position: absolute; left: 0; right: 0; top: 22px; text-align: center;\n    transform: translateZ(13px);\n    font-family: 'Cinzel', serif; font-weight: 800; font-size: 8px;\n    letter-spacing: 0.32em; color: rgba(239,237,232,0.4);\n  }\n\n  /* ---- LID half : cover art outside, booklet clipped inside ---- */\n  .lid {\n    position: absolute; inset: 0; transform-style: preserve-3d;\n    transform-origin: left center;\n    transform: translateZ(12px);\n    transition: transform 0.75s cubic-bezier(0.3,0.85,0.25,1);\n    cursor: pointer;\n  }\n  .case.open .lid { transform: translateZ(12px) rotateY(-166deg); }\n  /* front cover and interior are swapped by opacity mid-swing — deterministic\n     across engines, unlike backface-visibility on these flattened slot planes */\n  .lid-front { position: absolute; inset: 0; transform: translateZ(12px); transition: opacity 0.12s linear 0.3s; }\n  .case.open .lid-front, .case.open .lid-glass { opacity: 0; }\n  .lid-glass {\n    position: absolute; inset: 0; transform: translateZ(12.6px); transition: opacity 0.12s linear 0.3s;\n    background: linear-gradient(128deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.015) 62%, rgba(255,255,255,0.15) 100%);\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), inset 0 0 18px rgba(255,255,255,0.07);\n  }\n  .lid:hover .lid-glass { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), inset 0 0 24px rgba(255,255,255,0.15); }\n  .lid-inner {                                    /* interior of the lid */\n    position: absolute; inset: 0; transform: rotateY(180deg) translateZ(0.4px);\n    opacity: 0; transition: opacity 0.12s linear 0.3s;\n    background: linear-gradient(158deg, #101012, #07070a 60%, #0d0d10);\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.8);\n    padding: 16px 14px; display: flex; flex-direction: column;\n  }\n  .case.open .lid-inner { opacity: 1; }\n  .lwall { position: absolute; background: #0e0e11; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }\n  .lwall.t { width: 200px; height: 12px; top: 0; left: 0; transform-origin: top center; transform: rotateX(-90deg); }\n  .lwall.b { width: 200px; height: 12px; bottom: 0; left: 0; transform-origin: bottom center; transform: rotateX(90deg); }\n  .lwall.r { width: 12px; height: 300px; top: 0; right: 0; transform-origin: center right; transform: rotateY(-90deg); }\n\n  /* spine, printed with the title — the edge you'd see on a shelf */\n  .spine {\n    position: absolute; left: 0; top: 0; width: 24px; height: 300px;\n    transform-origin: left center; transform: rotateY(-90deg);\n    background: #050506; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);\n    overflow: hidden;\n  }\n  .spine .hint { font-size: 4.5px; }\n  .spine-print { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }\n  .spine-print span {\n    font-size: 6.5px; font-weight: 700; letter-spacing: 0.3em; white-space: nowrap;\n    transform: rotate(90deg); color: rgba(239,237,232,0.8);\n  }\n\n  /* booklet clipped into the lid, behind two retention flaps */\n  .bk-clip {\n    position: relative; width: 100%; height: 100%;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .flap {\n    position: absolute; width: 26px; height: 5px; background: #24242a;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); z-index: 3;\n  }\n  .flap.tl { top: -1px; left: 8px; } .flap.tr { top: -1px; right: 8px; }\n  .flap.bl { bottom: -1px; left: 8px; } .flap.br { bottom: -1px; right: 8px; }\n  .booklet {\n    position: relative; width: 150px; height: 236px;\n    background: #e9e5da; color: #131313;\n    box-shadow: 0 2px 12px rgba(0,0,0,0.8);\n    cursor: pointer; overflow: hidden;\n    padding: 13px 12px; display: flex; flex-direction: column; gap: 7px;\n    transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1);\n  }\n  .booklet:hover { transform: translateY(-3px); }\n  .bk-kicker { font-size: 4.5px; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.6; }\n  .bk-rule { height: 1px; background: #131313; opacity: 0.5; }\n  .bk-title { font-  inset 0 -1px 2px rgba(0,0,0,0.32);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .grip span {\n    font-size: 5px; font-weight: 700; letter-spacing: 0.2em; font-style: italic;\n    color: #6d6c67; text-shadow: 0 1px 0 rgba(255,255,255,0.28);\n  }\n  /* insertion arrow beside the bevel */\n  .ins {\n    position: absolute; right: 20px; top: 3px;\n    font-size: 6px; letter-spacing: 0.1em; color: #74736f;\n    text-shadow: 0 1px 0 rgba(255,255,255,0.2);\n  }\n  .side-code { position: absolute; font-size: 3.8px; letter-spacing: 0.16em; color: #75746f; white-space: nowrap; text-transform: uppercase; }\n  .side-code.l { left: 3px; top: 100px; transform: rotate(-90deg); transform-origin: left bottom; }\n  .cart:hover .cart-face-bg { filter: brightness(1.1); }\n\n  /* ================================================================\n     MAGAZINE — issue 01, lying beside the case\n     ================================================================ */\n  .mag {\n    position: absolute; width: 138px; height: 184px;\n    left: 224px; top: 104px;\n    transform-style: preserve-3d;\n    transform: translateZ(-10px) rotateY(11deg) rotateZ(-2deg);\n    transition: transform 0.5s cubic-bezier(0.25,1.1,0.4,1);\n    cursor: pointer;\n  }\n  .mag:hover { transform: translateZ(4px) rotateY(11deg) rotateZ(-2deg) translateY(-8px); }\n  .mag-pages {                       /* the paper block, seen as a stacked edge */\n    position: absolute; inset: 0; transform: translateZ(-1px);\n    background: linear-gradient(90deg, #cdc8bb, #e7e3d8 60%, #b9b4a7);\n    box-shadow: 0 6px 18px rgba(0,0,0,0.7);\n  }\n  .mag-edge {\n    position: absolute; top: 0; right: 0; width: 7px; height: 184px;\n    transform-origin: center right; transform: rotateY(90deg);\n    background: repeating-linear-gradient(180deg, #e9e5da 0 1.4px, #c3bfb2 1.4px 2.8px);\n  }\n  .mag-cover {\n    position: absolute; inset: 0; transform: translateZ(1px);\n    background: #0a0a0a; overflow: hidden;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);\n  }\n  .mag-print {\n    position: absolute; inset: 0; padding: 11px 10px;\n    display: flex; flex-direction: column; gap: 5px; background: #e9e5da; color: #131313;\n  }\n  .mag-mast {\n    font-family: 'Cinzel', serif; font-weight: 800; font-size: 17px; line-height: 0.88;\n    letter-spacing: 0.01em; text-transform: uppercase; color: #b8352c;\n    -webkit-text-stroke: 0.6px #131313;\n  }\n  .mag-rule { height: 2px; background: #131313; }\n  .mag-strap { font-size: 4.5px; letter-spacing: 0.26em; text-transform: uppercase; opacity: 0.65; }\n  .mag-shot { flex: 1; box-shadow: inset 0 0 0 1px rgba(19,19,19,0.3); background: repeating-linear-gradient(45deg, rgba(19,19,19,0.06) 0 5px, transparent 5px 11px); }\n  .mag-lead { font-family: 'Cinzel', serif; font-weight: 800; font-size: 9px; line-height: 1.05; text-transform: uppercase; }\n  .mag-dek { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 7px; line-height: 1.35; opacity: 0.75; }\n  .mag-issue { position: absolute; right: 10px; top: 10px; font-size: 4.5px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.6; }\n  .mag-tag {\n    position: absolute; left: 0; right: 0; bottom: -20px; text-align: center;\n    font-size: 5px; letter-spacing: 0.3em; color: rgba(239,237,232,0.34);\n  }\n  .mag:hover .mag-tag { color: rgba(239,237,232,0.75); }\n\n  /* ================================================================\n     MANUAL OVERLAY — the booklet, read flat\n     ================================================================ */\n  .manual {\n    position: fixed; inset: 0; z-index: 80;\n    display: flex; align-items: center; justify-content: center;\n    background: rgba(0,0,0,0.72);\n    opacity: 0; pointer-events: none; transition: opacity 0.3s linear;\n  }\n  .manual.on { opacity: 1; pointer-events: auto; }\n  .man-page {\n    width: 380px; max-width: calc(100vw - 40px); height: min(560px, calc(100vh - 48px));\n    bac \n  .man-close {\n    position: absolute; top: 12px; right: 14px; z-index: 5;\n    appearance: none; background: none; border: 0; cursor: pointer;\n    font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.2em; color: #131313; opacity: 0.55;\n  }\n  .man-close:hover { opacity: 1; color: #b8352c; }\n\n  .hint-bar {\n    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;\n    font-size: 8px; letter-spacing: 0.28em; text-transform: uppercase;\n    color: rgba(239,237,232,0.5); pointer-events: none; z-index: 50;\n  }\n<\u002Fstyle>\n<style id=\"lnrt-noscroll\">*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}*::-webkit-scrollbar-thumb,*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner,*::-webkit-scrollbar-button{display:none!important;background:0 0!important}<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"viewport\" id=\"vp\">\n  <div class=\"stage-scale\">\n    <div class=\"stage\" id=\"stage\">\n      <div class=\"case\" id=\"case\">\n        <!-- ===== MAGAZINE ===== -->\n        <div class=\"mag\" id=\"mag\">\n          <div class=\"mag-pages\"><\u002Fdiv>\n          <div class=\"mag-edge\"><\u002Fdiv>\n          <div class=\"mag-cover slot\" data-tex=\"assets/pachinko/mag-cover.webp\">\n            <img alt=\"\" data-src=\"assets/pachinko/mag-cover.webp\">\n            <div class=\"mag-print hint-print\">\n              <div class=\"mag-mast\">Lunarot<br>Power<\u002Fdiv>\n              <div class=\"mag-rule\"><\u002Fdiv>\n              <div class=\"mag-strap\">Issue 01 · unsealed<\u002Fdiv>\n              <div class=\"mag-shot\"><\u002Fdiv>\n              <div class=\"mag-lead\">Making it<br>feel cursed<\u002Fdiv>\n              <div class=\"mag-dek\">Twelve pages inside the possessed board.<\u002Fdiv>\n              <div class=\"mag-issue\">✶ 01<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mag-tag\">◆ ISSUE 01 — READ<\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <!-- ===== BASE HALF ===== -->\n        <div class=\"base\">\n          <div class=\"base-outer slot\" data-tex=\"assets/pachinko/case-back.webp\">\n            <img alt=\"\" data-src=\"assets/pachinko/case-back.webp\">\n            <div class=\"hint\"><b>CASE BACK<\u002Fb>SLOT · 200×300<br>assets/pachinko/case-back.webp<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bwall t\"><\u002Fdiv>\n          <div class=\"bwall b\"><\u002Fdiv>\n          <div class=\"bwall r\"><\u002Fdiv>\n          <div class=\"spine slot\" data-tex=\"assets/pachinko/case-spine.webp\">\n            <img alt=\"\" data-src=\"assets/pachinko/case-spine.webp\">\n            <div class=\"hint spine-print\"><span>ASTRAL PACHINKO · LNRT-01<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"base-inner\"><\u002Fdiv>\n          <div class=\"base-crest\">LUNAROT ✶ CONDUIT SERIES<\u002Fdiv>\n          <div class=\"tray\">\n            <div class=\"rib t\"><\u002Fdiv>\n            <div class=\"rib b\"><\u002Fdiv>\n            <div class=\"tray-tag\">CONDUIT SEATED<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- cartridge, clipped into the tray -->\n          <div class=\"cart\" id=\"cart\">\n            <div class=\"cart-rear\"><\u002Fdiv>\n            <div class=\"kwall t\"><\u002Fdiv>\n            <div class=\"kwall b\"><\u002Fdiv>\n            <div class=\"kwall l\"><\u002Fdiv>\n            <div class=\"kwall r\"><\u002Fdiv>\n            <div class=\"cart-face\">\n              <div class=\"cart-face-bg notch\"><\u002Fdiv>\n              <div class=\"rail-v l\"><\u002Fdiv>\n              <div class=\"rail-v r\"><\u002Fdiv>\n              <div class=\"ins\">▲<\u002Fdiv>\n              <div class=\"label-well\"><\u002Fdiv>\n              <div class=\"label-recess slot\" data-tex=\"assets/pachinko/cart-label.webp\">\n                <img alt=\"\" data-src=\"assets/pachinko/cart-label.webp\">\n                <div class=\"hint\"><b>LABEL ART<\u002Fb>SLOT · 92×78<br>assets/pachinko/<br>cart-label.webp<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"grip\"><span>LUNAROT ✶ DEKA<\u002Fspan><\u002Fdiv>\n              <div class=\"side-code l\">LNRT-APAE-IDN 1<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== LID HALF ===== -->\n        <div class=\"lid\" id=\"lid\">\n          <div class=\"lid-front slot\" data-tex=\"assets/pachinko/case-front.webp\">\n            <img alt=\"\" data-src=\"assets/pachinko/case-front.webp\">\n            <div class=\"hint\"><b>CASE FRONT ART<\u002Fb>SLOT · 200×300<br>assets/pachinko/case-front.webp<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"lid-glass\"><\u002Fdiv>\n          <div class=\"lwall t\"><\u002Fdiv>\n          <div class=\"lwall b\"><\u002Fdiv>\n          <div class=\"lwall r\"><\u002Fdiv>\n          <div class=\"lid-inner\">\n            <div class=\"bk-clip\">\n              <div class=\"flap tl\"><\u002Fdiv><div class=\"flap tr\"><\u002Fdiv>\n              <div class=\"flap bl\"><\u002Fdiv><div class=\"flap br\"><\u002Fdiv>\n              <div class=\"booklet\" id=\"booklet\">\n                <div class=\"bk-kicker\">Lunarot Engine · 8-bit conduit<\u002Fdiv>\n                <div class=\"bk-rule\"><\u002Fdiv>\n                <div class=\"bk-title\">Astral<br>Pachinko<\u002Fdiv>\n                <div class=\"bk-sub\">Instruction booklet. Read before releasing a bead.<\u002Fdiv>\n                <div class=\"bk-seal\">✶<\u002Fdiv>\n                <div class=\"bk-open\">◆ Click to read<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== MANUAL ===== -->\n<div class=\"manual\" id=\"manual\">\n  <div class=\"man-page\" id=\"manPage\">\n    <button class=\"man-close\" id=\"manClose\">✕ CLOSE<\u002Fbutton>\n    <h1>Instruction Booklet<\u002Fh1>\n    <div class=\"dek\">Sacred Pachinko — a possessed board, a skeleton behind the glass, tarot deciding your fate.<\u002Fdiv>\n\n    <h2><i>01<\u002Fi> Seating the conduit<\u002Fh2>\n    <p>Take the cartridge from its tray and press it home. The board wakes on contact — there is no power switch, and there never was one.<\u002Fp>\n\n    <h2><i>02<\u002Fi> Releasing a bead<\u002Fh2>\n    <ol>\n      <li>Drop a bead from the top of the board.<\u002Fli>\n      <li>Pegs kick it sideways; every other row gives it a random upward hop, so nothing falls straight.<\u002Fli>\n      <li>The bottom row kicks hardest and least predictably.<\u002Fli>\n      <li>Side walls launch the bead rather than cushion it. Expect chaos.<\u002Fli>\n      <li>A bead that touches nothing on the way down is refunded — an unearned draw is no draw.<\u002Fli>\n    <\u002Fol>\n\n    <h2><i>03<\u002Fi> The gates<\u002Fh2>\n    <p>Each gate is marked with a glowing suit symbol. Whichever gate takes the bead chooses the card, and the card chooses the reading. You do not get to appeal.<\u002Fp>\n\n    <h2><i>04<\u002Fi> The arbiter<\u002Fh2>\n    <p>A skull sits behind the glass and watches. It reddens and grows angrier the higher your score climbs. Its tilt and shake are honest telemetry: if it lurches, something went wrong.<\u002Fp>\n\n    <h2><i>05<\u002Fi> Score &amp; victory<\u002Fh2>\n    <p>Score glows gold and should be read as a prize rather than a statistic. There is a real victory at the top of the ladder, and it arrives with a flash.<\u002Fp>\n\n    <h2><i>06<\u002Fi> Failure<\u002Fh2>\n    <p>Game over hits with a flash and a shatter, the text stumbling in piece by piece. Restart flashes and pulls back before it returns you to the start.<\u002Fp>\n\n    <h2><i>07<\u002Fi> Care of your conduit<\u002Fh2>\n    <p>Do not blow into the connector. Do not purge the registry mid-draw. Store away from direct sunlight and from anyone who would use it on your behalf.<\u002Fp>\n\n    <div class=\"man-notice\"><b>Notice ·<\u002Fb> This device draws cards for you. Lunarot Corporation reserves no rights, accepts no returns, and retains every attempt.<\u002Fdiv>\n\n    <div class=\"man-actions\">\n      <button class=\"man-act\" id=\"actLaunch\">◆ Insert cartridge — run astral-pachinko.bin<\u002Fbutton>\n      <button class=\"man-act\" id=\"actMag\">✶ Lunarot Power, issue 01 — the build diary<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"hint-bar\" id=\"hintBar\">Click the case to open it<\u002Fdiv>\n\n<script>\n  var embedded = false;\n  try { embedded = !!(window.parent !== window && window.parent.OS_BUILD); } catch (e) {}\n  if (!embedded) { document.documentElement.classList.add('solo'); document.body.classList.add('solo'); }\n\n  var vp = document.getElementById('vp');\n  var stage = document.getElementById('stage');\n  var kase = document.getElementById('case');\n  var lid = document.getElementById('lid');\n  var booklet = document.getElementById('booklet');\n  var cart = document.getElementById('cart');\n  var manual = document.getElementById('manual');\n  var mag = document.getElementById('mag');\n  var hintBar = document.getElementById('hintBar');\n\n  var isOpen = false, isOut = false, isReading = false, launching = false;\n\n  function setHint(t) {\n    hintBar.textContent = t;\n    try { parent.postMessage({ lunarotJewelHint: t.toUpperCase() }, '*'); } catch (e) {}\n  }\n  function focusParent() {\n    if (!embedded) return;\n    try { window.parent.postMessage({ type: 'LUNAROT_FOCUS' }, '*'); } catch (e) {}\n  }\n  function refreshHint() {\n    if (isReading) setHint('Scroll the booklet · ✕ to close');\n    else if (isOut) setHint('Click cartridge to run · magazine to read');\n    else if (isOpen) setHint('Click cartridge to lift it out · booklet or magazine to read');\n    else setHint('Click the case to open it · magazine to read');\n  }\n  refreshHint();\n\n  function setOpen(v) {\n    isOpen = v;\n    kase.classList.toggle('open', v);\n    vp.classList.toggle('open', v);\n    if (v) focusParent();\n    if (!v) { setReading(false); setOut(false); }\n    refreshHint();\n  }\n  function setOut(v) {\n    if (v && !isOpen) { setOpen(true); setTimeout(function () { setOut(true); }, 480); return; }\n    isOut = v;\n    cart.classList.toggle('out', v);\n    refreshHint();\n  }\n  function setReading(v) {\n    isReading = v;\n    manual.classList.toggle('on', v);\n    if (v) focusParent();\n    refreshHint();\n  }\n  function launch() {\n    if (launching) return;\n    launching = true;\n    setHint('Conduit launching');\n    cart.classList.add('launch');\n    setTimeout(function () {\n      if (embedded) {\n        try { window.parent.postMessage({ type: 'LUNAROT_OPEN_PACHINKO' }, '*'); } catch (e) {}\n      } else {\n        try { window.open('/sacred-pachinko', '_blank'); } catch (e) {}\n      }\n    }, 500);\n    setTimeout(function () {\n      cart.classList.remove('launch');\n      cart.classList.remove('out');\n      isOut = false; launching = false;\n      refreshHint();\n    }, 1600);\n  }\n\n  lid.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!isOpen); });\n  booklet.addEventListener('click', function (e) { e.stopPropagation(); setReading(true); });\n  document.getElementById('manClose').addEventListener('click', function (e) { e.stopPropagation(); setReading(false); });\n  manual.addEventListener('click', function (e) { if (e.target === manual) setReading(false); });\n  cart.addEventListener('click', function (e) {\n    e.stopPropagation();\n    if (!isOut) setOut(true); else launch();\n  });\n  document.getElementById('actLaunch').addEventListener('click', function (e) {\n    e.stopPropagation(); setReading(false); setOut(true); setTimeout(launch, 420);\n  });\n  function openMag() {\n    if (embedded) {\n      try { window.parent.postMessage({ type: 'LUNAROT_OPEN_MAGAZINE' }, '*'); } catch (err) {}\n    } else {\n      try { window.open((window.__resources && window.__resources.pachinkoMagazine) || 'pachinko-magazine.html', '_blank'); } catch (err) {}\n    }\n  }\n  mag.addEventListener('click', function (e) { e.stopPropagation(); openMag(); });\n  document.getElementById('actMag').addEventListener('click', function (e) { e.stopPropagation(); openMag(); });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (isReading) setReading(false); else if (isOpen) setOpen(false); } });\n\n  /* ---- texture slots ---- */\n  (function fillSlots() {\n    var slots = [].slice.call(document.querySelectorAll('.slot'));\n    var left = slots.length;\n    function done() { if (--left <= 0) stage.classList.add('ready'); }\n    slots.forEach(function (s) {\n      var img = s.querySelector('img');\n      var src = s.getAttribute('data-tex');\n      if (!img || !src) { done(); return; }\n      var probe = new Image();\n      probe.onload = function () { img.src = src; s.classList.add('filled'); done(); };\n      probe.onerror = function () { img.remove(); done(); };\n      probe.src = src;\n    });\n    setTimeout(function () { stage.classList.add('ready'); }, 2000);\n  })();\n\n  /* ---- drag to rotate + pinch/wheel zoom ---- */\n  var dragging = false, lastX = 0, lastY = 0, moved = 0;\n  var rotX = 8, rotY = -26, scale = 1.1, pinchStart = 0, pinchBase = 1.1;\n  var scaler = document.querySelector('.stage-scale');\n  function applyRot() {\n    stage.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)' + (isOpen ? ' translateX(-52px)' : '');\n  }\n  function applyScale() { scaler.style.transform = 'scale(' + scale + ')'; }\n\n  document.addEventListener('mousedown', function (e) {\n    if (isReading) return;\n    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;\n    stage.style.transition = 'none';\n  });\n  document.addEventListener('mousemove', function (e) {\n    if (!dragging) return;\n    moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);\n    rotY += (e.clientX - lastX) * 0.4;\n    rotX -= (e.clientY - lastY) * 0.4;\n    rotX = Math.max(-80, Math.min(80, rotX));\n    lastX = e.clientX; lastY = e.clientY;\n    applyRot();\n  });\n  document.addEventListener('mouseup', function () {\n    dragging = false;\n    stage.style.transition = 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)';\n  });\n  document.addEventListener('click', function (e) { if (moved > 8) { e.stopPropagation(); moved = 0; } }, true);\n  document.addEventListener('wheel', function (e) {\n    if (isReading) return;\n    e.preventDefault();\n    scale = Math.max(0.6, Math.min(2.6, scale - e.deltaY * 0.0012));\n    applyScale();\n  }, { passive: false });\n\n  document.addEventListener('touchstart', function (e) {\n    if (isReading) return;\n    if (e.touches.length === 2) {\n      pinchStart = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n      pinchBase = scale; dragging = false;\n    } else if (e.touches.length === 1) {\n      dragging = true; moved = 0; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;\n      stage.style.transition = 'none';\n    }\n  }, { passive: false });\n  document.addEventListener('touchmove', function (e) {\n    if (e.touches.length === 2 && pinchStart) {\n      e.preventDefault();\n      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n      scale = Math.max(0.6, Math.min(2.6, pinchBase * d / pinchStart));\n      applyScale();\n    } else if (dragging && e.touches.length === 1) {\n      e.preventDefault();\n      moved += 4;\n      rotY += (e.touches[0].clientX - lastX) * 0.4;\n      rotX -= (e.touches[0].clientY - lastY) * 0.4;\n      rotX = Math.max(-80, Math.min(80, rotX));\n      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;\n      applyRot();\n    }\n  }, { passive: false });\n  document.addEventListener('touchend', function (e) {\n    if (e.touches.length < 2) pinchStart = 0;\n    if (e.touches.length === 0) { dragging = false; stage.style.transition = 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)'; }\n  });\n<\u002Fscript>\n\n<script>\n(function(){\n  function send(e){ if (window.parent && window.parent !== window) window.parent.postMessage({type:'LUNAROT_POINTER', x:e.clientX, y:e.clientY}, '*'); }\n  window.addEventListener('pointermove', send, {passive:true});\n  window.addEventListener('mousemove', send, {passive:true});\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

        stage.style.transform = `rotateX(${xDeg !== undefined ? xDeg : 8}deg) rotateY(${yDeg}deg)`;
