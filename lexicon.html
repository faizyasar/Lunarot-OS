wwal" (The First) in Islamic metaphysics. It is the boundary between the infinite and the manifest universe.',linguistics:{etymology:"Hebrew K-T-R (crown), Arabic A-W-L (first/origin).",rootConsonants:"כ.ת.ר / أ.و.ل",cognates:'Akkadian "katāru", Arabic "awwal" (first).',historicalEvolution:'Viewed across Abrahamic traditions as the unmanifest origin. Pseudo-Dionysius called it the "Ray of Divine Darkness". Ibn Arabi refers to the absolute essence (Dhat).'},primarySources:[{manuscriptName:"Zohar / Mystical Theology (Pseudo-Dionysius)",manuscriptEra:"Medieval Period",quotedTextOriginal:"בְּרֵאשִׁית דָּא כֶּתֶר עֶלְיוֹן... / γνόφον ἀγνωσίας",quotedTextTranslation:"Keter Elyon is primordial to all... / He plunges into the truly mystic darkness of unknowing.",scholarlyInterpretation:'Both traditions emphasize that the ultimate source of reality cannot be grasped by human thought, requiring a surrender to "unknowing" or "nothingness".'}]},{id:"chokhmah",name:"Wisdom",hebrew:"חָכְמָה",arabic:"الحكيم (Al-Hakim)",latin:"Sapientia",transliteration:"Chokhmah / Al-Hakim",meaning:"Divine Wisdom",bodyPart:"Right Orbit / Temporal Bone",skeletalCategory:"HEAD / TEETH",pillar:"Right",color:"from-gray-300 to-gray-200",glowColor:"rgba(200, 200, 200, 0.4)",coordinates:{x:300,y:120},bodyCoords:{x:230,y:80},description:"The raw flash of wisdom. The initial seed of creation. In Christianity, often associated with the Logos or the Son. In Islam, Al-Hakim (The Wise) represents the spontaneous, unconditioned knowing of the Divine.",linguistics:{etymology:"Hebrew Ch-K-M, Arabic H-K-M.",rootConsonants:"ח.כ.מ / ح.ك.م",cognates:'Aramaic "Chakmeta", Arabic "Hikmah" (wisdom).',historicalEvolution:"Wisdom literature (Proverbs) personifies Wisdom. Early Christian thought equated it with the Logos (Word). Islamic philosophy (Falsafa) honors Hikmah as the highest knowledge."},primarySources:[{manuscriptName:"Proverbs 8:22 / Ibn Sina (Avicenna)",manuscriptEra:"Antiquity / 11th Century",quotedTextOriginal:"יְהוָה, קָנָנִי רֵאשִׁית דַּרְכּוֹ",quotedTextTranslation:"The Lord brought me forth as the first of his works... / Wisdom is the perfection of the human soul through conceptualization.",scholarlyInterpretation:"Wisdom is seen as the first emanation or structural principle by which the universe was designed."}]},{id:"binah",name:"Understanding",hebrew:"בִּינָה",arabic:"الخبير (Al-Khabir)",latin:"Intellectus / Prudentia",transliteration:"Binah / Al-Khabir",meaning:"Analytical Intelligence",bodyPart:"Left Orbit / Temporal Bone",skeletalCategory:"HEAD / TEETH",pillar:"Left",color:"from-gray-400 to-gray-300",glowColor:"rgba(150, 150, 150, 0.4)",coordinates:{x:100,y:120},bodyCoords:{x:170,y:80},description:`The active, architectural intelligence. The "Mother" that receives the seed of Wisdom and expands it into structured concepts. Corresponds to the Holy Spirit's organizing power in some Christian mystical frameworks, and the detailed awareness (Al-Khabir) in Islam.`,linguistics:{etymology:"Hebrew root B-Y-N (between, distinguish), Arabic Kh-B-R (experience, inner knowledge).",rootConsonants:"ב.י.נ / خ.ب.ر",cognates:'Syriac "Bayna", Arabic "Bayān" (clarity).',historicalEvolution:"Moved from general logic to the cosmic womb of creation. Represents the analytical power that differentiates reality into distinct forms."},primarySources:[{manuscriptName:"The Bahir / Al-Ghazali (Mishkat al-Anwar)",manuscriptEra:"12th Century CE",quotedTextTranslation:"Binah distinguishes between matters... / The intelligence is the true light that separates and makes all things manifest.",scholarlyInterpretation:"Both Jewish and Islamic texts view this attribute as the separating, defining light that structures the cosmos."}]},{id:"daat",name:"Knowledge / Gnosis",hebrew:"דַּעַת",arabic:"العليم (Al-Alim)",latin:"Scientia / Gnosis",transliteration:"Da'at / Al-Alim",meaning:"Integrated Knowledge",bodyPart:"Cervical Vertebrae (Brain stem to C7)",skeletalCategory:"SPINE & NECK",pillar:"Center",color:"from-gray-500 to-gray-400",glowColor:"rgba(100, 100, 100, 0.4)",coordinates:{x:200,y:190},bodyCoords:{x:200,y:120},description:"The synthesis of Wisdom and Understanding. In Christian mysticism, it relates to Gnosis—direct, experiential knowledge of the Divine. In Sufism, it parallels Ma'rifa (inner knowing), distinguishing it from mere intellectual data.",linguistics:{etymology:"Hebrew Y-D-A (to know/experience), Arabic 'A-L-M (to know).",rootConsonants:"י.ד.ע / ع.ل.م",cognates:'Akkadian "edû", Arabic "Alim" (All-Knowing).',historicalEvolution:"Associated with the Tree of Knowledge. Represents the descent of abstract intellect into the emotional, lived experience."},primarySources:[{manuscriptName:"Gospel of Thomas / Rumi (Masnavi)",manuscriptEra:"1st Century CE / 13th Century CE",quotedTextTranslation:"The Kingdom is inside of you, and it is outside of you. When you come to know yourselves, then you will become known... / The heart's knowledge (Ma'rifa) is a light from God.",scholarlyInterpretation:"Knowledge is not academic but existential. Da'at/Gnosis/Ma'rifa is the unifying bridge between the mind and the heart."}]},{id:"chesed",name:"Mercy / Grace",hebrew:"חֶסֶד",arabic:"الرحمن (Ar-Rahman)",latin:"Gratia / Misericordia",transliteration:"Chesed / Ar-Rahman",meaning:"Lovingkindness",bodyPart:"Right Clavicle / Humerus",skeletalCategory:"ARMS & HANDS",pillar:"Right",color:"from-white to-gray-200",glowColor:"rgba(255, 255, 255, 0.4)",coordinates:{x:300,y:260},bodyCoords:{x:270,y:215},description:"Unconditional benevolence and the expansive force of love. Parallel to Christian Agape/Grace and Islamic Rahmah (Mercy). It is the limitless, outward-flowing cosmic stream of divine generosity.",linguistics:{etymology:"Hebrew Ch-S-D (benevolence), Arabic R-H-M (womb, mercy).",rootConsonants:"ח.ס.ד / ر.ح.م",cognates:'Syriac "Chasda", Arabic "Rahmah".',historicalEvolution:`Fundamental to all Abrahamic faiths: God's primary attribute is mercy (e.g., "Bismillah ir-Rahman ir-Rahim" and "God is Love").`},primarySources:[{manuscriptName:"1 John 4:8 / Quran (Al-Fatiha)",manuscriptEra:"Antiquity / 7th Century CE",quotedTextTranslation:"God is love (agape)... / The Entirely Merciful, the Especially Merciful.",scholarlyInterpretation:"The right pillar represents the expansive, giving nature of the Divine that creates and sustains the universe out of pure grace."}]},{id:"gevurah",name:"Severity / Justice",hebrew:"גְּבוּרָה",arabic:"القهار (Al-Qahhar)",latin:"Iustitia / Severitas",transliteration:"Gevurah / Al-Qahhar",meaning:"Strength / Constraint",bodyPart:"Left Clavicle / Humerus",skeletalCategory:"ARMS & HANDS",pillar:"Left",color:"from-gray-600 to-gray-500",glowColor:"rgba(80, 80, 80, 0.4)",coordinates:{x:100,y:260},bodyCoords:{x:130,y:215},description:"Cosmic constraint, boundary, and justice. In Christianity, it aligns with divine law and judgment. In Islam, Al-Qahhar (The Subduer) or Al-Jalal (Majesty/Rigor). It provides the necessary boundaries (Tzimtzum) that prevent the light of Mercy from overwhelming creation.",linguistics:{etymology:"Hebrew G-B-R (strong/warrior), Arabic Q-H-R (to subdue/overcome).",rootConsonants:"ג.ב.ר / ق.ه.ر",cognates:'Akkadian "gabru", Arabic "Jabbar" (Compeller).',historicalEvolution:"The counterbalance to mercy. Medieval theologians across all three faiths grappled with reconciling God's infinite mercy with His strict justice."},primarySources:[{manuscriptName:"Sha'are Orah / Al-Ghazali",manuscriptEra:"13th Century / 11th Century",quotedTextTranslation:"Gevurah is the attribute of Stern Judgment... / He is the Subduer (Al-Qahhar) who breaks the backs of the proud.",scholarlyInterpretation:"Justice/Severity is seen as a necessary structuring force, preventing cosmic dissolution and enforcing moral boundaries."}]},{id:"tiferet",name:"Beauty / Harmony",hebrew:"תִּפְאֶרֶת",arabic:"الجميل (Al-Jamil)",latin:"Harmonia / Pulchritudo",transliteration:"Tiferet / Al-Jamil",meaning:"Equilibrium",bodyPart:"Sternum / Ribcage (Thoracic Center)",skeletalCategory:"THORAX & RIBS",pillar:"Center",color:"from-gray-400 to-gray-300",glowColor:"rgba(180, 180, 180, 0.4)",coordinates:{x:200,y:330},bodyCoords:{x:200,y:240},description:"The core of the system, balancing Mercy and Justice. Known as Beauty (Tiferet) in Kabbalah, it corresponds to the Son (Christ) in Christian Kabbalah (the mediator), and Jamal (Divine Beauty) in Sufism.",linguistics:{etymology:"Hebrew P-A-R (glorify/adorn), Arabic J-M-L (beauty).",rootConsonants:"פ.א.ר / ج.م.ل",cognates:`Aramaic "Pe'er", Arabic "Jamil".`,historicalEvolution:'Recognized as the synthesizing heart of the divine attributes. "God is beautiful and He loves beauty" (Hadith).'},primarySources:[{manuscriptName:"Zohar / Sahih Muslim (Hadith)",manuscriptEra:"Medieval",quotedTextTranslation:"Tiferet is the trunk of the Tree, unifying the Right and the Left... / Verily, Allah is beautiful and He loves beauty.",scholarlyInterpretation:"Harmony is achieved not by eliminating opposing forces (Mercy and Severity), but by uniting them into a higher aesthetic and moral synthesis."}]},{id:"netzach",name:"Victory / Endurance",hebrew:"נֶצַח",arabic:"القوي (Al-Qawiyy)",latin:"Victoria / Aeternitas",transliteration:"Netzach / Al-Qawiyy",meaning:"Active Propulsion",bodyPart:"Right Femur / Patella",skeletalCategory:"LEGS & FEET",pillar:"Right",color:"from-gray-500 to-gray-400",glowColor:"rgba(120, 120, 120, 0.4)",coordinates:{x:300,y:450},bodyCoords:{x:245,y:500},description:"Endurance, active push, the conquest of obstacles. It is the dynamic propulsion of divine will into the world, reflecting God's strength (Al-Qawiyy) and the eternal triumph of the divine plan.",linguistics:{etymology:"Hebrew N-Tz-Ch (conquer/eternity), Arabic Q-W-Y (strong).",rootConsonants:"נ.צ.ח / ق.و.ي",cognates:'Aramaic "Natzach".',historicalEvolution:"Represents the right pillar supporting the active flow of prophecy and divine intervention in history."},primarySources:[{manuscriptName:"1 Corinthians 15:57 / Sefer Yetzirah",manuscriptEra:"1st Century CE / Antiquity",quotedTextTranslation:"But thanks be to God, who gives us the victory... / He made the letter Ayin king in Netzach...",scholarlyInterpretation:"Netzach embodies the triumph over material limitations and the active grace that sustains existence."}]},{id:"hod",name:"Splendor / Submission",hebrew:"הוֹד",arabic:"المجيد (Al-Majid)",latin:"Gloria / Submissio",transliteration:"Hod / Al-Majid",meaning:"Receptive Alignment",bodyPart:"Left Femur / Patella",skeletalCategory:"LEGS & FEET",pillar:"Left",color:"from-gray-600 to-gray-500",glowColor:"rgba(80, 80, 80, 0.4)",coordinates:{x:100,y:450},bodyCoords:{x:155,y:500},description:"Aesthetic splendor, surrender, and resonance. While Netzach pushes forward, Hod yields. It aligns with the Islamic concept of Islam itself (submission to God) and Christian humility before divine glory (Gloria).",linguistics:{etymology:"Hebrew H-W-D (praise/submit), Arabic M-J-D (glory).",rootConsonants:"ה.ו.ד / م.ج.د",cognates:`Aramaic "Hoda'ah" (giving thanks).`,historicalEvolution:"The virtue of earnestness and quiet, interior submission to reality. The left support of prophecy."},primarySources:[{manuscriptName:"Pardes Rimonim / Meister Eckhart",manuscriptEra:"16th Century / 14th Century",quotedTextTranslation:"Hod is that which returns the incoming light... / Be completely receptive to God... true obedience is a detachment from self.",scholarlyInterpretation:"Hod is the spiritual prism that forms boundaries through submission, turning active drive into structured, reverent ritual."}]},{id:"yesod",name:"Foundation",hebrew:"יְסוֹד",arabic:"الباطن (Al-Batin)",latin:"Fundamentum",transliteration:"Yesod / Al-Batin",meaning:"Channeling / Focus",bodyPart:"Sacrum / Coccyx (Pelvic basin)",skeletalCategory:"PELVIS",pillar:"Center",color:"from-gray-400 to-gray-300",glowColor:"rgba(160, 160, 160, 0.4)",coordinates:{x:200,y:540},bodyCoords:{x:200,y:430},description:"The funnel or foundation of consciousness. It collects all upper energies and channels them down. Parallels the hidden, foundational reality (Al-Batin) that connects the spiritual to the material, acting as the covenantal bridge.",linguistics:{etymology:"Hebrew Y-S-D (lay a foundation), Arabic B-T-N (hidden/inner).",rootConsonants:"י.ס.ד / ب.ط.ن",cognates:'Akkadian "isdu", Arabic "Asās".',historicalEvolution:"Viewed as the axis mundi, the righteous pillar that channels divine grace into the manifest world."},primarySources:[{manuscriptName:"Proverbs 10:25 / Zohar",manuscriptEra:"Antiquity / Medieval",quotedTextTranslation:"The righteous is the foundation of the world... / All the attachments of the upper realms gather in Yesod.",scholarlyInterpretation:"Yesod is the conduit, gathering the diffuse potential of the upper attributes into a single focused beam for manifestation."}]},{id:"malkhut",name:"Kingdom / Immanence",hebrew:"מַלְכוּת",arabic:"الملك (Al-Malik)",latin:"Regnum / Immanentia",transliteration:"Malkhut / Al-Malik",meaning:"Physical Reality",bodyPart:"Metatarsals / Phalanges (Feet grounding)",skeletalCategory:"LEGS & FEET",pillar:"Center",color:"from-gray-800 to-black",glowColor:"rgba(50, 50, 50, 0.4)",coordinates:{x:200,y:650},bodyCoords:{x:200,y:650},description:"The material universe and divine immanence (Shechinah). Corresponds to the Kingdom of God on Earth in Christianity, and Mulk (the visible realm of dominion) in Islam. It is the final vessel receiving the divine light.",linguistics:{etymology:"Hebrew M-L-K (rule), Arabic M-L-K (king/dominion).",rootConsonants:"מ.ל.כ / م.ل.ك",cognates:'Akkadian "malaku", Arabic "Malik" / "Mulk".',historicalEvolution:"Shifted from earthly kingdoms to the concept of the indwelling divine presence within physical creation, yearning to reunite with the transcendent source."},primarySources:[{manuscriptName:"Matthew 6:10 / Quran (Al-Mulk)",manuscriptEra:"1st Century CE / 7th Century CE",quotedTextTranslation:"Thy kingdom come, Thy will be done, on earth as it is in heaven. / Blessed is He in whose hand is dominion (Al-Mulk)...",scholarlyInterpretation:"Malkhut/Regnum/Mulk represents the culmination of the emanations, where the divine will is fully realized in the physical realm."}]}],wp=[{from:"keter",to:"chokhmah",letter:"א",trans:"Aleph",meaning:"Ox / Primordial Air"},{from:"keter",to:"binah",letter:"ב",trans:"Bet",meaning:"House / Wisdom Portal"},{from:"keter",to:"tiferet",letter:"ג",trans:"Gimel",meaning:"Camel / Eternal Bridge"},{from:"chokhmah",to:"binah",letter:"ד",trans:"Dalet",meaning:"Door / Cosmic Separation"},{from:"chokhmah",to:"tiferet",letter:"ה",trans:"He",meaning:"Window / Divine Breath"},{from:"chokhmah",to:"chesed",letter:"ו",trans:"Vav",meaning:"Hook / Connection"},{from:"binah",to:"tiferet",letter:"ז",trans:"Zayin",meaning:"Sword / analytical light"},{from:"binah",to:"gevurah",letter:"ח",trans:"Chet",meaning:"Fence / Sanctuary"},{from:"chesed",to:"gevurah",letter:"ט",trans:"Tet",meaning:"Serpent / Internalized Light"},{from:"chesed",to:"tiferet",letter:"י",trans:"Yod",meaning:"Hand / Spark of Origin"},{from:"chesed",to:"netzach",letter:"כ",trans:"Kaf",meaning:"Palm / Materialization"},{from:"gevurah",to:"tiferet",letter:"ל",trans:"Lamed",meaning:"Oad / Balance / Scales"},{from:"gevurah",to:"hod",letter:"מ",trans:"Mem",meaning:"Water / Infinite Source"},{from:"tiferet",to:"netzach",letter:"נ",trans:"Nun",meaning:"Fish / Creative Rebirth"},{from:"tiferet",to:"hod",letter:"ס",trans:"Samekh",meaning:"Shield / Support"},{from:"tiferet",to:"yesod",letter:"ע",trans:"Ayin",meaning:"Eye / Insight and Vision"},{from:"netzach",to:"hod",letter:"פ",trans:"Pe",meaning:"Mouth / Word of power"},{from:"netzach",to:"yesod",letter:"צ",trans:"Tsade",meaning:"Fishhook / Scribe of Truth"},{from:"netzach",to:"malkhut",letter:"ק",trans:"Qof",meaning:"Back of Head / Pure Matter"},{from:"hod",to:"yesod",letter:"ר",trans:"Resh",meaning:"Head / Receptive Mind"},{from:"hod",to:"malkhut",letter:"ש",t wable essence. It has no attributes and cannot be grasped by human contemplation.",mysticalSignificance:'Ein Sof represents the pre-manifest state of the Divine, shared across Abrahamic mysticism as the "Divine Darkness" (Christianity) or the "Essence" (Dhat in Sufism). It is the background from which all creation and Sephirot emerge.'},{id:"shekhinah",term:"Shekhinah / Divine Presence",hebrew:"שְׁכִינָה (Shekhinah)",arabic:"سكينة (Sakinah)",latin:"Praesentia Dei / Habitatio",transliteration:"Shekhinah / Sakinah",literalMeaning:"In-dwelling Presence",category:"Concepts",historicalPeriod:"Tannaitic Period / 7th Century CE (Quran)",manuscriptOrigin:"Talmud / Quran (Surah Al-Baqarah 2:248)",linguisticRoot:'Hebrew/Arabic ש.כ.נ / س.ك.ن (Shin/Sin-Kaf-Nun - "to dwell, settle, rest, or grant peace")',definition:"The immanent presence of the Divine in the physical world. In Kabbalah, it is the feminine aspect of God (Malkhut) that dwells among humanity. In Islam, Sakinah denotes the divine peace, tranquility, and presence that descends upon the hearts of believers.",mysticalSignificance:"A central symbol of God's closeness to creation. Unifying the transcendent aspect of God with the immanent Shekhinah/Sakinah is the ultimate goal of mystical practice, restoring cosmic harmony."},{id:"logos",term:"Logos / The Divine Word",hebrew:"מֵימְרָא (Memra) / דָּבָר (Davar)",arabic:"كلمة (Kalimah) / عقل (Aql)",latin:"Verbum / Logos",transliteration:"Memra / Kalimah / Verbum",literalMeaning:"The Word / Reason / Speech",category:"Concepts",historicalPeriod:"Hellenistic Period / 1st Century CE",manuscriptOrigin:"Targumim / Gospel of John / Quran",linguisticRoot:'Greek λέγω (lego - "to speak/reason"); Aramaic מ.א.מ.ר (Mem-Alef-Mem-Resh); Arabic ك.ل.م (Kaf-Lam-Mim)',definition:`The active, structuring, and generative word or intellect of God through which the universe is created. In Christianity, the Logos is identified with Christ. In Judaism (Memra) and Islam (Kalimah), it represents God's creative command ("Be, and it is").`,mysticalSignificance:"The Word acts as the bridge between the unknowable infinite God and the created finite cosmos. It is the primary vehicle of revelation and the structural blueprint of reality."},{id:"anima-mundi",term:"Anima Mundi / World Soul",hebrew:"נֶפֶשׁ הָעוֹלָם (Nefesh Ha-Olam)",arabic:"نفس العالم (Nafs al-'Alam)",latin:"Anima Mundi",transliteration:"Nefesh Ha-Olam / Nafs al-'Alam",literalMeaning:"Soul of the World",category:"Concepts",historicalPeriod:"Classical Antiquity / Medieval Philosophy",manuscriptOrigin:"Plato's Timaeus / Epistles of the Brethren of Purity",linguisticRoot:'Latin "anima" (soul) + "mundus" (world); Hebrew נ.פ.ש (soul); Arabic ن.ف.س (soul)',definition:"The intrinsic, vital, and animating force that pervades the universe. Just as a human soul animates a physical body, the Anima Mundi animates the cosmos, connecting all living things into a single organism.",mysticalSignificance:"In Western Esotericism and medieval Abrahamic philosophy, the World Soul acts as the energetic matrix giving life to the physical world, often associated with the lower Sephirot (Yesod) or the active intellect."},{id:"macrocosm-microcosm",term:"Macrocosm & Microcosm",hebrew:"עוֹלָם קָטָן (Olam Katan)",arabic:"العالم الصغير (Al-'Alam as-Saghir)",latin:"Microcosmus et Macrocosmus",transliteration:"Olam Katan / Al-'Alam as-Saghir",literalMeaning:"Small World (Microcosm)",category:"Concepts",historicalPeriod:"Hellenistic Period / Middle Ages",manuscriptOrigin:"Hermetic Corpus / Moreh Nevukhim (Guide for the Perplexed)",linguisticRoot:'Greek "makros" (large) + "kosmos" (world) and "mikros" (small)',definition:'The principle encapsulating the structural similarity and sympathetic resonance between the universe as a whole (Macrocosm) and the individual human being (Microcosm). "As above, so below."',mysticalSignificance:"This principle implies that the human being contains the blueprint of the entire cosmos. By understanding the self, one understands the universe and the Divine structure (Adam Kadmon / Insan al-Kamil)."},{id:"ruach-spiritus",term:"Ruach / Divine Spirit",hebrew:"רוּחַ הַקֹּדֶשׁ (Ruach HaKodesh)",arabic:"روح القدس (Ruh al-Qudus)",latin:"Spiritus Sanctus / Pneuma",transliteration:"Ruach HaKodesh / Ruh al-Qudus",literalMeaning:"Holy Spirit / Breath",category:"Concepts",historicalPeriod:"Biblical Antiquity",manuscriptOrigin:"Genesis / Psalms / Quran",linguisticRoot:'Hebrew/Arabic ר.ו.ח / ر.و.ح (Resh/Ra-Waw-Het/Ha - "wind, breath, spirit, expanse")',definition:"The divine breath, wind, or spirit that moves through creation, providing life and prophetic inspiration. It is the active, moving presence of God that inspires prophets and sustains existence.",mysticalSignificance:"The Spirit is the dynamic flow of divine energy. In Christian Trinitarian theology, it is a divine person; in Judaism and Islam, it is the divine force of inspiration and life-giving breath."},{id:"unio-mystica",term:"Unio Mystica / Divine Union",hebrew:"דְּבֵקוּת (Devekut) / בִּיטוּל (Bittul)",arabic:"فناء (Fana) / توحيد (Tawhid)",latin:"Unio Mystica / Visio Beatifica",transliteration:"Devekut / Fana",literalMeaning:"Cleaving / Annihilation / Union",category:"Practices",historicalPeriod:"Medieval Mysticism",manuscriptOrigin:"Sufi treatises (Al-Ghazali, Rumi) / Hasidic Masters",linguisticRoot:"Hebrew ד.ב.ק (to cling/cleave); Arabic ف.ن.ي (to pass away/annihilate)",definition:"The mystical experience of complete union with the Divine. In Kabbalah, it is Devekut (cleaving to God) and Bittul (nullification of the ego). In Sufism, it is Fana (annihilation of the self in God) leading to Baqa (subsisting in God).",mysticalSignificance:"The ultimate goal of the mystic's journey: to transcend the illusion of separation and experience the absolute oneness of existence. The soul returns to its primordial source."},{id:"prima-materia",term:"Prima Materia / First Matter",hebrew:"חֹמֶר הִיּוּלִי (Chomer Hiyuli)",arabic:"الهيولى (Al-Hayula)",latin:"Prima Materia / Hyle",transliteration:"Chomer Hiyuli / Al-Hayula",literalMeaning:"Formless Matter / Origin",category:"Concepts",historicalPeriod:"Classical Antiquity to Renaissance",manuscriptOrigin:"Aristotelian philosophy / Jabirian Alchemy / Rambam",linguisticRoot:'Greek ὕλη (hyle - "wood/matter"); Latin "prima" (first) + "materia"',definition:"The ubiquitous, formless starting material or pure potentiality from which all physical forms are structured. It is the chaotic, unmanifest base required for creation and the alchemical Magnum Opus.",mysticalSignificance:"Corresponds to Tohu wa-Bohu (formless void) in Genesis. It is the spiritual base metal that the mystic seeks to transmute into the gold of spiritual enlightenment."},{id:"gematria-abjad",term:"Gematria / Abjad Numerals",hebrew:"גֵּימַטְרִיָּא (Gematria)",arabic:"حساب الجمل (Hisab al-Jummal) / أبجد (Abjad)",latin:"Arithmantia / Isopsephy",transliteration:"Gematria / Hisab al-Jummal",literalMeaning:"Numerical Calculation of Letters",category:"Practices",historicalPeriod:"Antiquity / Middle Ages",manuscriptOrigin:"Sefer Yetzirah / Sufi Talismans / Hekhalot",linguisticRoot:'Greek "geōmetria" (geometry) / Arabic a-b-j-d (first letters of the alphabet)',definition:"An esoteric method of textual exegesis assigning numerical values to letters. By comparing words of equal numerical value, mystics uncover hidden connections, dualities, and secret identities between different concepts.",mysticalSignificance:"Reveals the deep mathematical skeleton of the universe, rooted in the belief that God created the world through letters and numbers."},{id:"ascent-of-soul",term:"Ascent of the Soul / Night Journey",hebrew:"עֲלִיַּת הַנְּשָׁמָה (Aliyat Ha-Neshamah)",arabic:"معراج (Mi'raj)",latin:"Ascensus Animae",transliteration:"Aliyat Ha-Neshamah / Mi'raj",literalMeaning:"Ascension of the Soul / The Ladder",category:"Practices",historicalPeriod:"Late Antiquity / 7th Century CE",manuscriptOrigin:"Hekhalot literature / Quran (Surah Al-Isra)",linguisticRoot:"Hebrew ע.ל.ה (to go up); Arabic ع.ر.ج (to ascend)",definition:"The mystical journey of the soul ascending through heavenly realms or spiritual spheres to reach the divine throne or ultimate presence. It involves passing through gates, overcoming angelic guards, or shedding layers of material attachment.",mysticalSignificance:"A universal Abrahamic mystical template. The Prophet Muhammad's Mi'raj and the Kabbalistic descent/ascent to the Merkabah (Chariot) represent the peak visionary experiences of communion with the Divine."},{id:"magnum-opus",term:"Magnum Opus / The Great Work",hebrew:"הָעֲבוֹדָה הַגְּדוֹלָה (Ha-Avodah Ha-Gedolah)",arabic:"الصنعة الكبرى (As-San'a al-Kubra) / الإكسير (Al-Iksir)",latin:"Magnum Opus",transliteration:"Ha-Avodah / As-San'a al-Kubra",literalMeaning:"The Great Work / The Elixir",category:"Practices",historicalPeriod:"Middle Ages / Renaissance",manuscriptOrigin:"European and Islamic Alchemical Corpus (Jabir ibn Hayyan)",linguisticRoot:'Latin "magnum" (great) + "opus" (work); Arabic ص.ن.ع (to make/craft)',definition:"In alchemy, the process of working with the Prima Materia to create the Philosopher's Stone (Al-Iksir). In Hermeticism and Abrahamic esoteric traditions, it is a metaphor for the profound spiritual transformation and purification of the practitioner.",mysticalSignificance:"The Great Work represents the conscious journey of the mystic refining the soul, transmuting the lead of the lower, egoic self into the spiritual gold of divine union."},{id:"adam-kadmon",term:"Adam Kadmon / The Perfect Man",hebrew:"אָדָם קַדְמוֹן (Adam Kadmon)",arabic:"الإنسان الكامل (Al-Insan al-Kamil)",latin:"Homo Primordialis / Homo Perfectus",transliteration:"Adam Kadmon / Insan al-Kamil",literalMeaning:"Primordial Man / Perfect Human",category:"Concepts",historicalPeriod:"Medieval Mysticism / Lurianic Kabbalah",manuscriptOrigin:"Lurianic texts / Ibn Arabi's Fusus al-Hikam",linguisticRoot:"Hebrew ק.ד.מ (ancient/primordial); Arabic ك.م.ل (perfect/complete)",definition:"The immaculate spiritual blueprint of humanity and the cosmos. In Kabbalah, it is the first spiritual structure post-creation. In Sufism (Insan al-Kamil), it is the perfect human who fully reflects all divine names and attributes (often associated with prophets like Muhammad).",mysticalSignificance:"Establishes the macrocosm-microcosm mirroring. Humans are created in the image of God because the physical human body mirrors this divine cosmic archetype, bridging the eternal and the temporal."}];/**

<style>
/* Hide the redundant 2D tree diagram */
svg { display: none !important; }
h2, h3 { opacity: 0 !important; } /* Specifically for Cosmology & Physiology */

/* The main layout is likely a flex row. We hid the right child (SVG). 
   Let's let the left child expand naturally without forcing hard widths on internals. */
#root > div > div:first-child {
    flex: 1 1 auto !important;
    max-width: none !important;
    padding-right: 40px !important;
}
/* Ensure text can breathe */
#root p {
    max-width: 600px !important;
}
</style>
<script>
window.addEventListener('load', () => {
    setInterval(() => {
        const tabs = document.querySelectorAll('span, button, a, div, p, li');
        for (let tab of tabs) {
            if (tab.textContent.trim().toUpperCase() === 'ENCYCLOPEDIA' && !tab.dataset.clicked) {
                tab.dataset.clicked = "true";
                tab.click();
                if(tab.parentElement) tab.parentElement.click();
            }
        }
    }, 250);
});
</script>
</head>

  <body>
    <div id="root"></div>
  </body>
